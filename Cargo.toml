# Workspace Cargo du monorepo yolo-stack.
# Piliers : pillars/<nom>/crates/* ; applications : apps/<nom>/crates/* ; harnais de benchmark : crates/*.
# Les membres crees sont listes explicitement, le glob pillars/*/crates/* absorbe les crates fusionnees.
[workspace]
resolver = "3"
members = [
    "crates/yolo-stack-routes",
    "crates/yolo-next",
    "pillars/yolo-ui/crates/yolo-ui-color",
    "pillars/*/crates/*",
]
exclude = [
    # Adaptateurs planifies (voir crates/README.md).
    "crates/yolo-stack-dioxus",
    "crates/yolo-stack-leptos",
    # Crates Shenron autonomes (declarent leur propre [workspace] ; Dioxus 0.7 et Leptos 0.8).
    "apps/shenron/crates/shenron-reader-poc",
    "apps/shenron/crates/shenron-site",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/yolo-rs/yolo-stack"
authors = ["aphrody-dev <contact@aphrody.com>"]

[workspace.dependencies]
# Crates internes
yolo-stack-routes = { path = "crates/yolo-stack-routes" }
yolo-ui-color = { path = "pillars/yolo-ui/crates/yolo-ui-color" }

# Crates yolo-ui consommees par chemin (checkout voisin) jusqu'a la fusion du pilier.
yolo-tokens = { path = "../yolo-ui/crates/yolo-tokens", default-features = false }
yolo-layout = { path = "../yolo-ui/crates/yolo-layout", default-features = false }

# UI -- versions crates.io verifiees le 2026-11-04 avec `cargo search <crate> --limit 1`.
dioxus = "0.8.0-alpha.3"
dioxus-fullstack = "0.8.0-alpha.3"
dioxus-router = "0.8.0-alpha.3"
wgpu = "30.0.1"
taffy = "0.15.1"
vello = "0.11.0"
parley = "0.12.0"
accesskit = "0.25.2"

# Runtime / reseau
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.8.9"

# Serialisation / observabilite / erreurs
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
anyhow = "1.0.104"
thiserror = "2.0.21"

# Images / cryptographie (yolo-plugins)
image = { version = "0.25.10", default-features = false }
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"

# Benchmarks
criterion = { version = "0.8.2", default-features = false }

# Leptos : couche optionnelle d'ilots wasm minimal (harnais de benchmark), pin stable 2026-10-31.
leptos = { version = "=0.8.23", default-features = false }
leptos_router = "=0.8.23"
leptos_axum = "=0.8.23"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Sous-ensemble pedantic desactive : bruit sans valeur pour du code numerique/UI.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# Garde-fous supplementaires
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
# Meme base que yolo-ui / Dioxus upstream ; mesurer tout changement separement.
lto = true
codegen-units = 1
opt-level = 3

[profile.wasm-size]
inherits = "release"
opt-level = "z"
