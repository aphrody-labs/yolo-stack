# yolo-stack ecosystem manifest
# One [[source]] per external item assessed in docs/ECOSYSTEM-COMBINATION.md.
# kind: "repo" | "crate" | "npm" | "bun-builtin"
# mode: "vendor-pin" | "npm-dep" | "cargo-dep" | "port-to-rust" | "shim" | "reject" | "builtin"
# version: the value verified on the given date (npm latest, crates.io max_stable, git tag or
#          "main@<last push date>" for repositories without a release relevant to us,
#          Bun release for builtins).
# `bun run scripts/ecosystem.ts` (task 10 of the combination document) reads this file with
# Bun.TOML.parse and compares versions with Bun.semver.

[ecosystem]
verified = "2026-11-04"
bun = "1.4.4"
react = "19.3.1"
oxc_crates = "0.157.0"
rust_msrv_required_by_oxc = "1.97.0"
document = "docs/ECOSYSTEM-COMBINATION.md"

